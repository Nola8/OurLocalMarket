<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Our Local Market - Buyer Dashboard</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/farmer-style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      .buyer-header {
        background: linear-gradient(135deg, #2f8f44 0%, #267a38 100%);
      }
      .buyer-sidebar {
        background: #1a2526;
      }
      .buyer-card {
        border-left: 4px solid #2f8f44;
      }
      .sidebar {
        width: 250px;
      }
      .main-content {
        margin-left: 250px;
      }
    </style>
  </head>
  <body>
    <div class="app-container">
      <aside class="sidebar buyer-sidebar">
        <div class="logo">
          <h2>🛒 Buyer Dashboard</h2>
          <p class="role">Welcome Shopper</p>
        </div>

        <nav class="nav-menu">
          <a href="#" class="nav-item active">
            <i class="fas fa-tachometer-alt"></i>
            <span>Dashboard</span>
          </a>
          <a href="shop.html" class="nav-item">
            <i class="fas fa-store"></i>
            <span>Shop Products</span>
          </a>
          <a href="cart.html" class="nav-item active">
            <i class="fas fa-shopping-cart"></i>
            <span>My Cart</span>
            <span class="badge" id="cartCount">0</span>
          </a>
          <a
            href="#"
            class="nav-item"
            onclick="
              event.preventDefault();
              showProfileModal();
            "
          >
            <i class="fas fa-user"></i>
            <span>My Account</span>
          </a>
          <a href="#" class="nav-item" id="logoutBtn">
            <i class="fas fa-sign-out-alt"></i>
            <span>Logout</span>
          </a>
        </nav>

        <div class="user-info">
          <div class="user-avatar">
            <img
              src="https://ui-avatars.com/api/?name=Buyer&background=2196F3&color=fff"
              alt="Buyer"
              id="userAvatar"
            />
          </div>
          <div class="user-details">
            <h4 id="buyerName">Loading...</h4>
            <p id="buyerEmail">...</p>
            <span class="status online">● Active</span>
          </div>
        </div>
      </aside>

      <main class="main-content">
        <header class="top-bar buyer-header">
          <div class="search-box">
            <i class="fas fa-search"></i>
            <input
              type="text"
              placeholder="Search products..."
              onclick="window.location.href = 'index.html'"
            />
          </div>
          <div class="top-actions">
            <button
              class="btn-add"
              onclick="window.location.href = 'index.html'"
            >
              <i class="fas fa-store"></i> Shop Now
            </button>
            <div class="notifications">
              <i class="fas fa-bell"></i>
              <span class="badge">2</span>
            </div>
            <div class="user-menu">
              <img
                src="https://ui-avatars.com/api/?name=Buyer&background=2196F3&color=fff"
                alt="User"
                id="headerAvatar"
              />
            </div>
          </div>
        </header>

        <div class="dashboard-content">
          <div class="section-header">
            <h2>My Orders</h2>
          </div>

          <!-- Recent Orders Section -->
          <div class="card">
            <div class="card-header">
              <h3>Recent Orders</h3>
              <a href="#" class="view-all" id="viewAllRecentOrders">View All</a>
            </div>
            <div class="orders-list" id="recentOrdersList">
              <!-- Recent orders will be loaded here by JavaScript -->
              <p style="text-align: center; padding: 2rem; color: #666">
                <i
                  class="fas fa-shopping-cart"
                  style="font-size: 2rem; margin-bottom: 1rem; display: block"
                ></i>
                No recent orders
              </p>
            </div>
          </div>

          <div class="card" style="margin-top: 30px">
            <div class="card-header">
              <h3>Order History</h3>
              <a href="#" class="view-all" id="viewAllOrderHistory">View All</a>
            </div>
            <div class="orders-list" id="orderHistoryList">
              <p style="text-align: center; padding: 2rem; color: #666">
                <i
                  class="fas fa-box-open"
                  style="font-size: 2rem; margin-bottom: 1rem; display: block"
                ></i>
                No past orders
              </p>
            </div>
          </div>
        </div>
      </main>
    </div>
    <script src="js/buyer-main.js"></script>
  </body>
</html>
